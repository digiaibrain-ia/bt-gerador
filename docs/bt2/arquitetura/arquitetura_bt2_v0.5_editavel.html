<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquitetura BT2 Editável</title>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* MODULOS (mesma ordem do arquivo): CSS · DADOS (nos, ligacoes, analise) · ESTADO · ROTEAMENTO · DESENHO · INTERACAO · EXPORTAR · INICIO.
   Um unico modelo de dados alimenta os 3 estilos: Blocos, Ilustrado e Agentes. Posicoes editadas ficam por estilo. */
:root{--bg:#F9FAFB;--fg:#1F2937;--muted:#6B7280;--card:#FFFFFF;--line:#D5DAE1;--arrow:#64748B;--dash:#B9C0CC;--panel:#FFFFFF;
 --blue:#E8F1FD;--blue-s:#3F82E8;--mint:#E7F7EF;--mint-s:#2FAE7C;--yellow:#FFF6DB;--yellow-s:#E0A21B;--pink:#FDEBEF;--pink-s:#E0507A;--purple:#F0EBFC;--purple-s:#6D4BD8;--gray:#EEF1F5;--gray-s:#64748B;--orange:#FF8C00;--plc:#374151;
 --ok:#1E8E5A;--warn:#B7791F;--fut:#6B7280;--tipbg:#1F2937;--tipfg:#F9FAFB;--font:"Inter","Helvetica Neue",Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F172A;--fg:#E5E7EB;--muted:#9CA3AF;--card:#1B2644;--line:#33406A;--arrow:#94A3B8;--dash:#45527A;--panel:#17213A;--blue:#14284A;--mint:#12332A;--yellow:#3A2F10;--pink:#3A1A26;--purple:#251B4A;--gray:#18213A;--plc:#475569;--ok:#4ADE80;--warn:#FBBF24;--fut:#9CA3AF;--tipbg:#E5E7EB;--tipfg:#111827;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F172A;--fg:#E5E7EB;--muted:#9CA3AF;--card:#1B2644;--line:#33406A;--arrow:#94A3B8;--dash:#45527A;--panel:#17213A;--blue:#14284A;--mint:#12332A;--yellow:#3A2F10;--pink:#3A1A26;--purple:#251B4A;--gray:#18213A;--plc:#475569;--ok:#4ADE80;--warn:#FBBF24;--fut:#9CA3AF;--tipbg:#E5E7EB;--tipfg:#111827;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;font-size:14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.app{max-width:1280px;margin:0 auto}
h1{font-size:clamp(20px,3.4vw,28px);margin:0;font-weight:700}
.top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.top .sub{color:var(--muted);font-size:13px}
.abas{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.abas button,.bar button,.bar label.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:9px;padding:6px 11px;cursor:pointer}
.abas button[aria-pressed="true"]{background:var(--purple-s);border-color:var(--purple-s);color:#fff;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.bar button:hover,.abas button:hover{border-color:var(--arrow)}
.bar button[aria-pressed="true"]{background:var(--mint-s);border-color:var(--mint-s);color:#fff}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.bar .zoom{min-width:44px;text-align:center;color:var(--muted);font-size:12px}
.bar details{position:relative}.bar summary{list-style:none;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 11px;cursor:pointer}
.bar details[open] .menu{position:absolute;z-index:30;top:34px;left:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:230px}
.bar .menu button{text-align:left}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.d-real{background:var(--ok)}.d-pend{background:var(--yellow-s)}.d-fut{background:#9CA3AF}.d-ban{background:var(--blue-s)}
.vp{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg);max-height:calc(100vh - 210px);min-height:420px;position:relative}
.esp{position:relative}
#cena{position:absolute;left:0;top:0;transform-origin:0 0}
#cena.edit{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
svg.ed{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.ed .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.ln{fill:none;stroke:var(--arrow);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ln.pend{stroke:var(--yellow-s);stroke-dasharray:7 5}.ln.fut{stroke:#9CA3AF;stroke-dasharray:2 6}
.ln.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
.ah{fill:var(--arrow)}.ah.pend{fill:var(--yellow-s)}.ah.fut{fill:#9CA3AF}
.elab rect{fill:var(--panel);stroke:var(--line)}.elab text{fill:var(--muted);font-size:11px;font-weight:600;font-family:var(--font)}
.gr{position:absolute;border:1.5px dashed var(--dash);border-radius:16px}
.gr .tg{position:absolute;left:14px;top:10px;color:#fff;font-weight:700;font-size:12.5px;border-radius:6px;padding:3px 10px;white-space:nowrap}
.c-blue{background:var(--blue)}.c-mint{background:var(--mint)}.c-yellow{background:var(--yellow)}.c-pink{background:var(--pink)}.c-purple{background:var(--purple)}.c-gray{background:var(--gray)}
.t-blue{background:var(--blue-s)}.t-mint{background:var(--mint-s)}.t-yellow{background:var(--yellow-s)}.t-pink{background:var(--pink-s)}.t-purple{background:var(--purple-s)}.t-gray{background:var(--gray-s)}
.nd{position:absolute;user-select:none}
.edit .nd{cursor:grab;touch-action:none}.edit .nd.drag{cursor:grabbing}.edit .gr .tg{cursor:grab;touch-action:none}
.nd .st{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%}
.s-real .st{background:var(--ok)}.s-pend .st,.s-diag .st{background:var(--yellow-s)}.s-fut .st{background:#9CA3AF}.s-ban .st{background:var(--blue-s)}
.s-fut{opacity:.78}
.sel{outline:2px solid var(--purple-s);outline-offset:2px}
.tb{display:none;position:absolute;left:0;top:-30px;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;z-index:999}
.edit .nd:hover .tb,.edit .nd.sel .tb{display:flex}
.tb button{font-size:12px;border:0;background:transparent;cursor:pointer;padding:2px 5px;border-radius:5px;color:var(--fg)}.tb button:hover{background:var(--gray)}
.rz{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;display:none;background:linear-gradient(135deg,transparent 50%,var(--arrow) 50%);border-radius:0 0 10px 0;touch-action:none}
.edit .nd .rz{display:block}
.med{position:absolute;left:4px;bottom:-16px;font-size:10px;color:var(--muted);white-space:nowrap;display:none}.medidas .med{display:block}
.lock .tg{opacity:.7}
.gl{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff}
/* estilo BLOCOS */
.sk-b .nd{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.1);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;overflow:hidden}
.sk-b .nd.s-fut{border-style:dashed}
.sk-b .nd .ic{width:36px;height:36px}.sk-b .nd .tx b{display:block;font-size:13.5px;line-height:1.25;padding-right:12px}.sk-b .nd .tx span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sk-b .nd.col .tx span{display:none}
/* estilo ILUSTRADO */
.sk-i .nd{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
.sk-i .nd svg.fg{width:100%;flex:1 1 auto;min-height:0;overflow:visible}.sk-i .nd .lb{font-weight:600;font-size:13.5px;line-height:1.2;padding-top:2px}
.sk-i .nd .st{right:14px;top:4px}
/* estilo AGENTES */
.sk-a .nd{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(16,24,40,.08);padding:7px 9px;display:flex;gap:8px;align-items:center;overflow:hidden}
.sk-a .nd .ic{width:30px;height:30px}.sk-a .nd .tx b{display:block;font-size:12px;line-height:1.2;padding-right:8px}
.sk-a .nd.s-fut{border-style:dashed}
.sk-a .nd.dir{background:var(--purple-s);border-color:var(--purple-s);color:#fff}.sk-a .nd.dir .ic{background:rgba(255,255,255,.2)!important}
.sk-a .nd.res{background:var(--orange);border-color:var(--orange);color:#1F2937;justify-content:center;text-align:center}.sk-a .nd.res .ic{background:rgba(31,41,55,.85)!important}
.sk-a .nd.col .tx{display:none}
@keyframes dash{to{stroke-dashoffset:-13}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.18}}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%,40%{transform:translateX(0)}50%,90%{transform:translateX(14px)}100%{transform:translateX(0)}}
@keyframes draw{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
@keyframes typing{0%{transform:scaleX(.2)}60%,100%{transform:scaleX(1)}}
@keyframes heat{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-14px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.led{animation:blink 1.6s steps(1) infinite}.led.d1{animation-delay:.3s}.led.d2{animation-delay:.7s}.led.d3{animation-delay:1.1s}
.bar_{transform-box:fill-box;transform-origin:bottom;animation:bar 1.8s ease-in-out infinite alternate}.bar_.d1{animation-delay:.4s}.bar_.d2{animation-delay:.9s}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
.knob{animation:slide 4s ease-in-out infinite}.knob.d1{animation-delay:1.1s}.knob.d2{animation-delay:2.2s}
.chart{stroke-dasharray:140;animation:draw 3s ease-in-out infinite alternate}
.type{transform-box:fill-box;transform-origin:left;animation:typing 2.4s ease-in-out infinite alternate}.type.d1{animation-delay:.5s}.type.d2{animation-delay:1s}
.heat{animation:heat 2.2s ease-out infinite}.heat.d1{animation-delay:.7s}.heat.d2{animation-delay:1.4s}
.beat{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.fcard{fill:var(--card);stroke:var(--line);stroke-width:1}
#tip{position:fixed;z-index:60;max-width:330px;background:var(--tipbg);color:var(--tipfg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none}
#tip b{display:block;font-size:13px;margin-bottom:3px}#tip i{display:block;font-style:normal;opacity:.8;margin-top:4px;font-size:11.5px}
.an{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:100%}
.an h2{font-size:16px;margin:18px 0 8px}.an h2:first-child{margin-top:0}
.an .tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.an table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:620px}.an th,.an td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.an th{background:var(--gray);font-weight:600}
.an p,.an li{line-height:1.5}
.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:0 7px;font-size:11px;font-weight:600}
.p-real{color:var(--ok)}.p-pend{color:var(--warn)}.p-fut{color:var(--fut)}.p-ban{color:var(--blue-s)}
#exp{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#exp.on{display:flex}#exp .box{background:var(--panel);border-radius:14px;max-width:760px;width:100%;padding:14px;display:flex;flex-direction:column;gap:8px;max-height:90vh}
#exp textarea{width:100%;height:46vh;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
#exp .row{display:flex;gap:8px;flex-wrap:wrap}#exp button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:9px;padding:6px 12px;cursor:pointer}
.nota{font-size:12px;color:var(--muted);margin-top:8px}
.hint{font-size:12px;color:var(--muted)}
@media print{.top .sub,.abas,.bar,.leg,.nota,.hint{display:none}.vp{max-height:none;border:0}}
</style>
</head>
<body>


<div class="app">
  <div class="top"><h1>Arquitetura BT2</h1><span class="sub">Um modelo, três estilos. Edite, salve e exporte como na maquete.</span></div>
  <div class="abas" role="tablist" id="abas"></div>
  <div class="bar" id="bar"></div>
  <div class="leg" id="leg"><span><i class="dot d-real"></i>em uso</span><span><i class="dot d-pend"></i>pendente ou em diagnóstico</span><span><i class="dot d-fut"></i>futuro</span><span><i class="dot d-ban"></i>só bancada</span><span class="hint" id="dica">Passe o mouse (ou toque) nas figuras e nas linhas para ver os detalhes.</span></div>
  <div id="vistaCena"><div class="vp" id="vp"><div class="esp" id="esp"><div id="cena"></div></div></div></div>
  <div id="vistaAn" hidden></div>
  <div id="tip" hidden></div>
</div>
<div id="exp"><div class="box"><b id="expT">Exportar</b><textarea id="expTx" readonly></textarea><div class="row"><button id="expCopia">Copiar</button><button id="expFecha">Fechar</button><span class="hint" id="expMsg"></span></div></div></div>

<script>
/* ============================== DADOS ============================== */
var ST={real:'em uso',pend:'pendente',diag:'em diagnóstico',fut:'futuro',ban:'só bancada'};
var CAT={tela:'blue',pc:'purple',plc:'mint',et:'yellow',campo:'pink',fut:'gray'};
/* nos: id,nome,sub,st,cor,gl(icone pequeno),fig(figura animada),det,g(grupo blocos/ilustrado),ga(grupo agentes),b[cx,cy],a[cx,cy],in('b'=blocos+ilustrado,'a'=agentes),sz */
var N=[
 {id:'medidor',nome:'Medidor gerador',sub:'v1.10.167 · PC e celular',st:'real',cor:'blue',gl:'monitor',fig:'medidor',g:'G_TELA',ga:'A_OP',b:[170,90],a:[140,100],in:'ba',
  det:'Tela principal. Usa o endereço da própria página (sem IP digitado). Lê as chaves a cada 1 s (GET) e envia os comandos (POST). Publica eventos em /api/dev/log-evento e, no navegador, nos canais bt2-dev-obs e bt2-grafico.'},
 {id:'gerenciador',nome:'Gerenciador de logs',sub:'v1.7',st:'real',cor:'blue',gl:'log',fig:'logs',g:'G_TELA',ga:'A_OP',b:[390,90],a:[320,100],in:'ba',
  det:'Lê GET /api/dev/logs e GET /api/logs/{banco}; limpa com POST /api/dev/logs/limpar; recebe também o canal bt2-dev-obs. O campo Servidor precisa apontar para o mesmo endereço da página.'},
 {id:'grafico',nome:'Gráfico do ensaio',sub:'v0.11',st:'real',cor:'blue',gl:'chart',fig:'graf',g:'G_TELA',ga:'A_OP',b:[610,90],a:[500,100],in:'ba',
  det:'Ensaio ao vivo em tela cheia (2º monitor) ou ensaio salvo. Recebe os dados do medidor por canal do navegador (BroadcastChannel bt2-grafico). A origem do campo de diretório (dirUrl) ainda não foi verificada.'},
 {id:'devtools',nome:'Ferramentas de apoio',sub:'visor · mapa · maquete · amostras',st:'real',cor:'blue',gl:'tools',fig:'tools',g:'G_TELA',ga:'A_OP',b:[830,90],a:[680,100],in:'ba',
  det:'Visor da API dos cards 0.3, Mapa dos FBs 0.15, Maquete de layout 0.4 e Simulador de amostras 0.7. Falam entre si e com o medidor por canais do navegador; a maquete não usa rede.'},
 {id:'guarda',nome:'Guarda de escrita',sub:'só a própria tela, em JSON (403)',st:'real',cor:'purple',gl:'shield',fig:'shield',g:'G_PC',ga:'A_ORQ',b:[590,262],a:[420,250],in:'ba',cls:'dir',
  det:'Toda rota de escrita confere o cabeçalho Origin (ou Referer) e o Content-Type JSON. Origem externa ou sem origem recebe 403 (proteção D3). Não substitui login.'},
 {id:'nodered',nome:'Node-RED',sub:'PC BT2 (.156)',st:'real',cor:'purple',gl:'hub',fig:'nr',g:'G_PC',ga:'A_ORQ',b:[590,392],a:[700,250],in:'ba',sz:{blocos:[220,92],ilustrado:[150,132]},
  det:'Ponte entre a tela e o PLC. Fila de comandos, revalidação na saída da fila, janela de confirmação de 2 s e quarentena por variável. Testado no Node-RED 5.0.9; a versão do PC ainda precisa ser confirmada.'},
 {id:'pm2',nome:'PM2',sub:'mantém o Node-RED rodando',st:'real',cor:'purple',gl:'refresh',fig:'refresh',g:'G_PC',b:[880,262],in:'b',
  det:'Gerenciador de processos do PC BT2. Pode guardar variáveis de ambiente (PLC_IP, DSE_URL); hoje os JSON do PC trazem o IP escrito dentro.'},
 {id:'chaves',nome:'Chaves BC56 · BC400',sub:'v3.4 · /api/chaves/{banco}',st:'real',cor:'mint',gl:'toggle',fig:'chaves',g:'G_PC',b:[130,540],in:'b',
  det:'Rotas: GET /api/chaves/{banco}; POST habilitar, selecionar, salvar, usarKwReal, limpar, ligar, banco, tensao; GET /api/logs/{banco}. Fila, revalidação, janela de 2 s, quarentena e reafirmação.'},
 {id:'logs',nome:'Logs de desenvolvedor',sub:'v1.3 · /api/dev/*',st:'real',cor:'yellow',gl:'term',fig:'term',g:'G_PC',b:[340,540],in:'b',

 {id:'cli156',nome:'Ler gerador (.156)',sub:'grava o DB2000 no PLC',st:'real',cor:'pink',gl:'play',fig:'pulse',g:'G_PC',b:[770,540],in:'b',

 {id:'sim',nome:'Simulador DSE',sub:'v7 · só em bancada',st:'ban',cor:'blue',gl:'bolt',fig:'dse',g:'G_PC',b:[1030,655],in:'b',

 {id:'db_chaves',nome:'DB3000 · DB3100',sub:'chaves (cb e sb)',st:'real',cor:'mint',gl:'db',fig:'db',g:'G_PLC',b:[130,810],in:'b',

 {id:'db2100',nome:'DB2100',sub:'snapshot do ensaio',st:'real',cor:'mint',gl:'db',fig:'db',g:'G_PLC',b:[550,810],in:'b',
  det:'Snapshot do registro do ensaio. Os dados só valem com preenchValido verdadeiro.'},
 {id:'db2000',nome:'DB2000',sub:'dados do DSE',st:'real',cor:'mint',gl:'db',fig:'db',g:'G_PLC',b:[770,810],in:'b',
  det:'Dados do DSE gravados pelo fluxo Ler gerador (.156).'},
 {id:'plc',nome:'PLC 1500 · Ensaio',sub:'FB100 (setup) · FB101 (ET200)',st:'real',cor:'mint',gl:'cpu',fig:'plc',g:'G_PLC',ga:'A_SIS',b:[460,945],a:[150,830],in:'ba',sz:{blocos:[300,96],ilustrado:[170,120]},

}

function marca(id){S.sel=id;var a=elCena.querySelectorAll('.nd.sel');for(var i=0;i<a.length;i++)a[i].classList.remove('sel');var el=elCena.querySelector('.nd[data-id="'+id+'"]');if(el)el.classList.add('sel')}
function muda(fn){fn();desenha()}
function iniciaInteracao(){
  elCena.addEventListener('pointerdown',function(e){
    if(!S.edit)return;var tgt=e.target;
    var tg=tgt.closest('[data-gt]');
    if(tg){var gid=tg.dataset.gt,skn=S.skin==='agentes'?'a':'b',ids=N.filter(function(n){return (skn==='a'?n.ga:n.g)===gid&&visivel(n)&&!P().hid[n.id]&&!P().lock[n.id]}).map(function(n){return n.id});
      var p0=pt(e);drag={t:'grupo',ids:ids,p0:p0,r0:ids.map(function(i){return ret(nodoPorId(i)).slice()})};tg.setPointerCapture(e.pointerId);e.preventDefault();return}
    var nd=tgt.closest('.nd');if(!nd)return;var id=nd.dataset.id,n=nodoPorId(id);
    var b=tgt.closest('button');if(b){acao(n,b.dataset.a);e.preventDefault();return}
    if(tgt.isContentEditable)return;
    selecionar(id);if(P().lock[id]){marca(id);return}
    var p0=pt(e),r0=ret(n).slice();drag={t:tgt.dataset.rz?'tam':'mov',id:id,p0:p0,r0:r0,moved:false};marca(id);if(!tgt.closest('[data-ed]')||tgt.dataset.rz){nd.setPointerCapture(e.pointerId);e.preventDefault()}nd.classList.add('drag');
  });
  elCena.addEventListener('pointermove',function(e){if(!drag)return;var q=pt(e),dx=q[0]-drag.p0[0],dy=q[1]-drag.p0[1],p=P();if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<4)return;drag.moved=true;
    if(drag.t==='mov'){p.pos[drag.id]=[snap(drag.r0[0]+dx),snap(drag.r0[1]+dy),drag.r0[2],drag.r0[3]]}
    else if(drag.t==='tam'){p.pos[drag.id]=[drag.r0[0],drag.r0[1],Math.max(70,snap(drag.r0[2]+dx)),Math.max(40,snap(drag.r0[3]+dy))]}
    else{drag.ids.forEach(function(i,k){var r=drag.r0[k];p.pos[i]=[snap(r[0]+dx),snap(r[1]+dy),r[2],r[3]]})}
    if(!drag.raf){drag.raf=requestAnimationFrame(function(){if(drag){drag.raf=0;desenha()}})}});
  function fim(){if(!drag)return;var mv=drag.moved;drag=null;if(mv)desenha();else{var a=elCena.querySelectorAll('.nd.drag');for(var i=0;i<a.length;i++)a[i].classList.remove('drag')}}
  elCena.addEventListener('pointerup',fim);elCena.addEventListener('pointercancel',fim);
  elCena.addEventListener('dblclick',function(e){if(!S.edit)return;var el=e.target.closest('[data-ed]');if(!el)return;var nd=el.closest('.nd'),n=nodoPorId(nd.dataset.id),campo=el.dataset.ed;
    el.contentEditable='true';el.focus();document.getSelection().selectAllChildren(el);
    el.addEventListener('blur',function(){el.contentEditable='false';var o=S.ov[n.id]=S.ov[n.id]||{};o[campo]=el.textContent.trim();desenha()},{once:true});
    el.addEventListener('keydown',function(k){if(k.key==='Enter'){k.preventDefault();el.blur()}})});
}
function acao(n,a){var p=P();
  if(a==='col')p.col[n.id]=!p.col[n.id];
  else if(a==='hid')p.hid[n.id]=true;
  else if(a==='lock')p.lock[n.id]=!p.lock[n.id];
  else if(a==='z'){var m=0;for(var k in p.z)m=Math.max(m,p.z[k]);p.z[n.id]=m+1}
  else if(a==='rst'){delete p.pos[n.id];delete p.hid[n.id];delete p.lock[n.id];delete p.col[n.id];delete p.z[n.id];delete S.ov[n.id]}
  else if(a==='st'){var ordem=['real','pend','diag','fut','ban'],o=S.ov[n.id]=S.ov[n.id]||{};var at=stat(n);o.st=ordem[(ordem.indexOf(at)+1)%ordem.length]}
  desenha();
}
function barra(){
  var bar=document.getElementById('bar'),abas=document.getElementById('abas');
  abas.innerHTML=['blocos','ilustrado','agentes'].map(function(k){return '<button data-skin="'+k+'" aria-pressed="'+(S.aba==='cena'&&S.skin===k)+'">'+SKINS[k].nome+'</button>'}).join('')+'<button data-skin="analise" aria-pressed="'+(S.aba==='analise')+'">Análise</button>';
  bar.innerHTML='<button data-b="edit" aria-pressed="'+S.edit+'">✎ Modo edição</button><span class="sep"></span><button data-b="zm">−</button><span class="zoom">'+Math.round(S.zoom*100)+'%</span><button data-b="zp">+</button><button data-b="fit">Ajustar</button><span class="sep"></span>'+
   '<button data-b="grid" aria-pressed="'+S.grid+'">Grade</button><button data-b="medidas" aria-pressed="'+S.medidas+'">Medidas</button><button data-b="fut" aria-pressed="'+S.fut+'">Mostrar futuro</button><button data-b="abrir">Abrir tudo</button><button data-b="recolher">Recolher tudo</button><button data-b="ocultos">Mostrar ocultos</button><span class="sep"></span>'+
   '<button data-b="salvar">💾 Salvar</button><button data-b="restaurar">Restaurar salvo</button><button data-b="layout">↺ Layout atual</button><details><summary>Exportar ▾</summary><div class="menu"><button data-b="x-txt">TXT — medidas (colar no chat)</button><button data-b="x-md">MD — tabelas do desenho</button><button data-b="x-json">JSON — posições (para reabrir)</button><button data-b="x-pdf">PDF — imprimir a tela</button><label class="btn" style="cursor:pointer">Abrir JSON salvo…<input type="file" id="arq" accept=".json,application/json" hidden></label></div></details>';
  document.getElementById('dica').textContent=S.edit?'Edição: arraste os blocos, redimensione pelo canto, dê duplo clique para renomear. Salve ao terminar.':'Passe o mouse (ou toque) nas figuras e nas linhas para ver os detalhes.';
}
function salvaLocal(){try{localStorage.setItem(CHAVE,JSON.stringify({per:S.per,ov:S.ov,v:1}));return true}catch(e){return false}}
function carregaLocal(){try{var j=JSON.parse(localStorage.getItem(CHAVE)||'null');if(j&&j.per){S.per=j.per;S.ov=j.ov||{};return true}}catch(e){}return false}
function fit(){var sk=SKINS[S.skin],w=elVp.clientWidth-4;S.zoom=Math.max(.5,Math.min(1,w/sk.W))}
function botoes(e){var b=e.target.closest('button');if(!b)return;var k=b.dataset.b,p=P();
  if(k==='edit'){S.edit=!S.edit;S.sel=null}
  else if(k==='zm')S.zoom=Math.max(.3,+(S.zoom-.1).toFixed(2));else if(k==='zp')S.zoom=Math.min(2,+(S.zoom+.1).toFixed(2));else if(k==='fit')fit();
  else if(k==='grid')S.grid=!S.grid;else if(k==='medidas')S.medidas=!S.medidas;else if(k==='fut')S.fut=!S.fut;
  else if(k==='abrir')p.col={};else if(k==='recolher'){N.forEach(function(n){if(visivel(n))p.col[n.id]=true})}
  else if(k==='ocultos')p.hid={};
  else if(k==='salvar'){var ok=salvaLocal();aviso(ok?'Salvo neste navegador.':'Não foi possível salvar aqui (armazenamento bloqueado). Use Exportar > JSON.')}
  else if(k==='restaurar'){var ok2=carregaLocal();aviso(ok2?'Layout salvo restaurado.':'Não há layout salvo neste navegador.')}
  else if(k==='layout'){S.per[S.skin]={};S.ov={}}
  else if(k&&k.indexOf('x-')===0){exporta(k.slice(2));return}
  barra();desenha();
}
function aviso(t){var h=document.getElementById('dica');h.textContent=t}
/* ============================== EXPORTAR ============================== */
function lista(){var p=P(),skn=S.skin==='agentes'?'a':'b';return N.filter(function(n){return visivel(n)})}
function exporta(tipo){
  var out='',p=P();
  if(tipo==='pdf'){try{window.print()}catch(e){}aviso('Se a impressão não abrir (página dentro de um visualizador), use o arquivo HTML baixado.');return}
  if(tipo==='txt'){out='ARQUITETURA BT2 — estilo '+SKINS[S.skin].nome+' (x, y, largura, altura em px)\n';lista().forEach(function(n){var r=ret(n);out+=(p.hid[n.id]?'[oculto] ':'')+nome(n)+' ['+ST[stat(n)]+']  '+r.join(', ')+(p.lock[n.id]?'  (travado)':'')+'\n'});}
  else if(tipo==='md'){out='# Arquitetura BT2 — estilo '+SKINS[S.skin].nome+'\n\n| Item | Situação | x | y | largura | altura |\n|---|---|---|---|---|---|\n';lista().forEach(function(n){var r=ret(n);out+='| '+nome(n)+' | '+ST[stat(n)]+' | '+r.join(' | ')+' |\n'});
    out+='\n## Ligações\n\n| De | Para | Rótulo | Situação |\n|---|---|---|---|\n';var sk=S.skin==='agentes'?'a':'b';E.forEach(function(e){if(e.sk===sk){var a=nodoPorId(e.de),b=nodoPorId(e.pa);if(visivel(a)&&visivel(b))out+='| '+nome(a)+' | '+nome(b)+' | '+(e.rot||'')+' | '+ST[e.st]+' |\n'}})}
  else{out=JSON.stringify({versao:1,estilo:S.skin,per:S.per,ov:S.ov},null,1)}
  document.getElementById('expT').textContent='Exportar · '+tipo.toUpperCase();document.getElementById('expTx').value=out;document.getElementById('exp').classList.add('on');document.getElementById('expMsg').textContent='';
}
/* ============================== ANALISE ============================== */
function tabelaAnalise(){
  var pill=function(s){return '<span class="pill p-'+({real:'real',pend:'pend',diag:'pend',fut:'fut',ban:'ban'}[s])+'">'+ST[s]+'</span>'};
  var h='<div class="an"><h2>1. Quem conversa com quem</h2><div class="tw"><table><tr><th>De</th><th>Para</th><th>Como</th><th>Situação</th><th>Detalhe</th></tr>';
  E.filter(function(e){return e.sk==='b'}).forEach(function(e){h+='<tr><td>'+esc(nodoPorId(e.de).nome)+'</td><td>'+esc(nodoPorId(e.pa).nome)+'</td><td>'+esc(e.rot||'—')+'</td><td>'+pill(e.st)+'</td><td>'+esc(e.det)+'</td></tr>'});
  h+='</table></div><p class="nota">As telas também conversam entre si, no mesmo navegador, por canais (BroadcastChannel): bt2-dev-obs (logs), bt2-grafico (dados do ensaio) e fbv. Isso não passa pelo Node-RED.</p>';
  h+='<h2>2. Rotas do Node-RED, por fluxo</h2><div class="tw"><table><tr><th>Fluxo</th><th>Leitura (GET)</th><th>Comando (POST)</th><th>Logs</th><th>Situação</th></tr>';
  ROTAS.forEach(function(r){h+='<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'});
  h+='</table></div><p class="nota">Todas as rotas de escrita passam pela guarda (Origin da própria página e JSON; senão 403). As respostas novas: 409 (cancelado ou estado mudou), 503 (leitura velha ou aguarde), 504 (incerto).</p>';
  h+='<h2>3. Ferramentas e infraestrutura</h2><div class="tw"><table><tr><th>Ferramenta</th><th>Para quê</th><th>Onde</th></tr>';FERR.forEach(function(r){h+='<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'});
  h+='</table></div><h2>4. Realidade e futuro</h2><div class="tw"><table><tr><th>Item</th><th>Situação</th></tr>';
  N.filter(function(n){return n.in.indexOf('b')>=0}).forEach(function(n){h+='<tr><td>'+esc(n.nome)+'</td><td>'+pill(n.st)+'</td></tr>'});
  h+='</table></div><h2>5. Pontos a confirmar</h2><ul>';PEND.forEach(function(r){h+='<li><b>'+esc(r[0])+'.</b> '+esc(r[1])+'</li>'});
  return h+'</ul></div>';
}
/* ============================== INICIO ============================== */
function mostra(){var an=S.aba==='analise';document.getElementById('vistaCena').hidden=an;var v=document.getElementById('vistaAn');v.hidden=!an;if(an)v.innerHTML=tabelaAnalise();
  document.querySelector('.bar').style.display=an?'none':'flex';document.getElementById('leg').style.display=an?'none':'flex'}
function inicio(){
  elCena=document.getElementById('cena');elVp=document.getElementById('vp');elEsp=document.getElementById('esp');
  carregaLocal();tooltip();iniciaInteracao();
  document.getElementById('abas').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var k=b.dataset.skin;if(k==='analise'){S.aba='analise'}else{S.aba='cena';S.skin=k;S.sel=null;fit()}barra();mostra();if(S.aba==='cena')desenha()});
  document.getElementById('bar').addEventListener('click',botoes);
  document.getElementById('bar').addEventListener('change',function(e){if(e.target.id!=='arq')return;var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(j.per){S.per=j.per;S.ov=j.ov||{};barra();desenha();aviso('Layout aberto do arquivo.')}else aviso('Arquivo sem layout reconhecido.')}catch(x){aviso('Arquivo inválido.')}};r.readAsText(f)});
  document.getElementById('expFecha').onclick=function(){document.getElementById('exp').classList.remove('on')};
  document.getElementById('expCopia').onclick=function(){var t=document.getElementById('expTx');t.select();var ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value);ok=true}}catch(e){}if(!ok){try{ok=document.execCommand('copy')}catch(e){}}document.getElementById('expMsg').textContent=ok?'Copiado.':'Selecionado: use Ctrl+C.'};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('exp').classList.remove('on')});
  fit();barra();mostra();desenha();
}
inicio();
</script>
